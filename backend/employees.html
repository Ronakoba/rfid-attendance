{% extends "base.html" %}
{% block content %}
  <h2>Employees & RFID Cards</h2>
  <form class="inline" method="post">
    <input type="text" name="emp_code" placeholder="Emp Code (e.g. EMP005)" required>
    <input type="text" name="name" placeholder="Full Name" required>
    <input type="text" name="department" placeholder="Department">
    <input type="text" name="card_uid" placeholder="Card UID (e.g. DEMO0005)" required>
    <button type="submit">Add Employee</button>
  </form>
  <table>
    <thead><tr><th>Code</th><th>Name</th><th>Department</th><th>Card UID</th><th>Active</th></tr></thead>
    <tbody>
      {% for e in employees %}
      <tr><td>{{ e.emp_code }}</td><td>{{ e.name }}</td><td>{{ e.department }}</td><td>{{ e.card_uid }}</td><td>{{ "Yes" if e.active else "No" }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
