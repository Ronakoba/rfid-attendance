<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>RFID Attendance</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <strong>RFID Attendance</strong>
    <a href="{{ url_for('dashboard') }}">Today</a>
    <a href="{{ url_for('report') }}">Monthly Report</a>
    <a href="{{ url_for('anomalies_view') }}">Anomalies</a>
    <a href="{{ url_for('employees_view') }}">Employees</a>
    <a href="{{ url_for('import_csv') }}">Import CSV</a>
    <a href="{{ url_for('settings_view') }}">Settings</a>
  </nav>
  <div class="container">
    {% for msg in get_flashed_messages() %}
      <div class="flash">{{ msg }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
